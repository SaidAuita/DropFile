name: Build DropFile

on:
  push:
    branches: [ main, macos ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run unit tests
        run: |
          python -m unittest discover tests

      - name: Build executable with PyInstaller
        run: |
          pyinstaller DropFile.spec --noconfirm

      - name: Upload Windows executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: DropFile-Windows-x64
          path: dist/DropFile.exe

  build-macos:
    name: Build macOS (.app)
    runs-on: macos-13
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements-mac.txt
          pip install pyinstaller

      - name: Run unit tests
        run: |
          python3 -m unittest discover tests

      - name: Build macOS Application Bundle
        run: |
          python3 build_mac.py

      - name: Upload macOS standalone app archive
        uses: actions/upload-artifact@v4
        with:
          name: DropFile-macOS-Universal
          path: dist/DropFile-macOS.zip
