name: Build DropFile

on:
  push:
    branches: [ main, macos ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run unit tests
        shell: bash
        run: |
          python -m unittest discover -s tests -t . -v 2>&1 | tee test_log.txt

      - name: Upload Windows test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Test-Log-Windows
          path: test_log.txt

      - name: Build executable with PyInstaller
        run: |
          python build_exe.py

      - name: Upload Windows executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: DropFile-Windows-x64
          path: dist/DropFile.exe

  build-macos:
    name: Build macOS (.app)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements-mac.txt
          pip install pyinstaller

      - name: Run unit tests
        run: |
          python3 -m unittest discover -s tests -t . -v 2>&1 | tee test_log.txt

      - name: Upload macOS test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Test-Log-macOS
          path: test_log.txt

      - name: Build macOS Application Bundle
        run: |
          python3 build_mac.py

      - name: Upload macOS standalone app archive
        uses: actions/upload-artifact@v4
        with:
          name: DropFile-macOS-Universal
          path: dist/DropFile-macOS.zip

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: DropFile-Windows-x64
          path: dist/

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: DropFile-macOS-Universal
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DropFile.exe
            dist/DropFile-macOS.zip
          generate_release_notes: true
